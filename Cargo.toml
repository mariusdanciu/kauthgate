[package]
name = "rbac-gate"
version = "0.1.0"
edition = "2024"

[dependencies]
pingora = { version = "0.9.0", features = ["proxy"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
kube = { version = "3.1.0", features = ["client", "runtime"] }
k8s-openapi = { version = "0.27", features = ["v1_32"] }
serde = { version = "1", features = ["derive"] }
config = "0.15"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
moka = {version = "0.12", features = ["future"]}
sha2 = "0.10"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal"] }
